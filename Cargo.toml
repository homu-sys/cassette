[package]
name = "cassette"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
dirs = "7.0.0"
image = "0.25.10"
lofty = "0.25.5"
ratatui = "0.30.2"
ratatui-image = { version = "12.0.0-rc.3", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "blocking"] }
rodio = { version = "0.23.0", features = ["symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-wav", "symphonia-aac", "symphonia-isomp4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
url = "2.5.8"
